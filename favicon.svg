    <ellipse cx="175" cy="270" rx="15" ry="12" fill="#f39c12" transform="rotate(-15,175,270)"/>
    <ellipse cx="290" cy="280" rx="15" ry="12" fill="#27ae60" transform="rotate(-15,290,280)"/>
    <ellipse cx="220" cy="340" rx="15" ry="12" fill="#8e44ad" transform="rotate(-15,220,340)"/>
    <ellipse cx="240" cy="200" rx="28" ry="22" fill="transparent" stroke="#d4c4a0" stroke-width="3"/>
